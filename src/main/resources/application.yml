server:
  port: 8090

spring:
  application:
    name: dataway
  cloud:
    nacos:
      discovery:
        # 服务发现接线（rcp-contracts/docs/DISCOVERY.md）：占位符默认值命中部署侧
        # Service 名（compose 服务名与 K8s Service 名均为 nacos），部署侧无需注入。
        server-addr: ${NACOS_SERVER:nacos:8848}
        namespace: ${NACOS_NAMESPACE:risk-control}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
  datasource:
    # 平台统一 PostgreSQL：默认指向本地 compose 的 postgres 服务，
    # 部署侧用 SPRING_DATASOURCE_URL/USERNAME/PASSWORD 注入覆盖。
    # 账号只给只读 + 模板所需写权限；单元测试另用 H2 内存库（见 DatawayControllerTest）。
    url: jdbc:postgresql://${PGHOST:localhost}:5432/risk_control
    username: ${PGUSER:risk_app}
    password: ${PGPASSWORD:risk_app_pwd}

dataway:
  datasource-name: main
  default-max-rows: 100
  # 表白名单：不在名单内的表一律拒绝（TABLE_NOT_ALLOWED）
  allowed-tables:
    - patrol_event
    - patrol_verdict
    # iam 经本服务读写用户与会话（RL-005），表结构真源在 rcp-ops/migrations/V1.4.0
    - iam_users
    - iam_sessions
  # 写入模板：客户端只能引用 ID，不能自带 SQL
  templates:
    event.insert: "INSERT INTO patrol_event(event_id, domain, version) VALUES (?, ?, ?)"
    verdict.insert: "INSERT INTO patrol_verdict(event_id, decision, score) VALUES (?, ?, ?)"
    iam.user.insert: "INSERT INTO iam_users(user_id, username, display_name, role, status, password_hash, password_salt) VALUES (?, ?, ?, ?, ?, ?, ?)"
    iam.user.update: "UPDATE iam_users SET display_name = ?, role = ?, status = ?, password_hash = ?, password_salt = ? WHERE user_id = ?"
    iam.session.insert: "INSERT INTO iam_sessions(token, user_id, expires_at) VALUES (?, ?, CAST(? AS TIMESTAMP))"
    iam.session.delete: "DELETE FROM iam_sessions WHERE token = ?"
    iam.session.deleteByUser: "DELETE FROM iam_sessions WHERE user_id = ?"
    iam.session.cleanExpired: "DELETE FROM iam_sessions WHERE expires_at < CURRENT_TIMESTAMP"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
